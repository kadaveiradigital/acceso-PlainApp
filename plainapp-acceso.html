<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Transferencia entre dispositivos · PlainApp</title>
    <link rel="icon" type="image/png" href="favicon.png" />

    <style>
      :root {
        --deep-twilight: #03045e;
        --french-blue: #023e8a;
        --teal-blue: #0077b6;
        --blue-green: #0096c7;
        --turquoise: #00b4d8;
        --sky-aqua: #48cae4;
        --frosted-1: #90e0ef;
        --frosted-2: #ade8f4;
        --light-cyan: #caf0f8;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        font-family:
          "Segoe UI",
          system-ui,
          -apple-system,
          sans-serif;
      }

      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background:
          radial-gradient(
            circle at 15% 10%,
            var(--light-cyan) 0%,
            transparent 45%
          ),
          radial-gradient(
            circle at 85% 90%,
            var(--frosted-1) 0%,
            transparent 50%
          ),
          linear-gradient(
            160deg,
            var(--light-cyan) 0%,
            var(--frosted-2) 35%,
            var(--sky-aqua) 70%,
            var(--turquoise) 100%
          );
        background-attachment: fixed;
        position: relative;
        overflow-x: hidden;
      }

      /* sutiles ondas decorativas de fondo */
      body::before,
      body::after {
        content: "";
        position: fixed;
        border-radius: 50%;
        filter: blur(60px);
        opacity: 0.35;
        z-index: 0;
      }
      body::before {
        width: 380px;
        height: 380px;
        background: var(--blue-green);
        top: -120px;
        left: -120px;
      }
      body::after {
        width: 420px;
        height: 420px;
        background: var(--french-blue);
        bottom: -140px;
        right: -140px;
        opacity: 0.25;
      }

      .card {
        position: relative;
        z-index: 1;
        width: 100%;
        max-width: 460px;
        background: linear-gradient(160deg, #ffffff 0%, var(--light-cyan) 100%);
        border-radius: 28px;
        padding: 44px 36px 36px;
        box-shadow:
          0 30px 60px -15px rgba(3, 4, 94, 0.35),
          0 10px 25px -8px rgba(0, 119, 182, 0.25),
          inset 0 1px 0 rgba(255, 255, 255, 0.8);
        border: 1px solid rgba(255, 255, 255, 0.6);
        animation: rise 0.7s cubic-bezier(0.2, 0.8, 0.2, 1) both;
      }

      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(18px) scale(0.98);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      .icon-wrap {
        width: 64px;
        height: 64px;
        margin: 0 auto 20px;
        border-radius: 18px;
        background: linear-gradient(
          145deg,
          var(--french-blue),
          var(--deep-twilight)
        );
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow:
          0 10px 20px -6px rgba(3, 4, 94, 0.5),
          inset 0 1px 1px rgba(255, 255, 255, 0.25);
      }

      .icon-wrap svg {
        width: 30px;
        height: 30px;
        stroke: var(--light-cyan);
      }

      h1 {
        text-align: center;
        font-size: 1.5rem;
        font-weight: 700;
        color: var(--deep-twilight);
        letter-spacing: -0.01em;
        margin-bottom: 6px;
      }

      .subtitle {
        text-align: center;
        color: var(--french-blue);
        font-size: 0.92rem;
        opacity: 0.8;
        margin-bottom: 30px;
        line-height: 1.4;
      }

      .links {
        display: flex;
        flex-direction: column;
        gap: 12px;
        margin-bottom: 22px;
      }

      .link-btn {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 14px 18px;
        background: linear-gradient(
          135deg,
          var(--deep-twilight),
          var(--french-blue)
        );
        color: #fff;
        text-decoration: none;
        border-radius: 14px;
        font-size: 0.98rem;
        font-weight: 600;
        letter-spacing: 0.01em;
        box-shadow:
          0 8px 18px -6px rgba(3, 4, 94, 0.45),
          inset 0 1px 0 rgba(255, 255, 255, 0.15);
        transition:
          transform 0.18s ease,
          box-shadow 0.18s ease,
          filter 0.18s ease;
      }

      .link-btn .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--turquoise);
        box-shadow: 0 0 8px var(--turquoise);
        flex-shrink: 0;
      }

      .link-btn .ip-text {
        flex: 1;
        text-align: left;
        font-variant-numeric: tabular-nums;
      }

      .link-btn .arrow {
        opacity: 0.7;
        transition: transform 0.18s ease;
      }

      .link-btn:hover {
        transform: translateY(-2px);
        filter: brightness(1.08);
        box-shadow:
          0 12px 22px -6px rgba(3, 4, 94, 0.55),
          inset 0 1px 0 rgba(255, 255, 255, 0.2);
      }
      .link-btn:hover .arrow {
        transform: translateX(3px);
      }
      .link-btn:active {
        transform: translateY(0);
      }

      .divider {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 22px 0 16px;
        color: var(--teal-blue);
        font-size: 0.75rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        opacity: 0.7;
      }
      .divider::before,
      .divider::after {
        content: "";
        flex: 1;
        height: 1px;
        background: linear-gradient(
          90deg,
          transparent,
          var(--blue-green),
          transparent
        );
        opacity: 0.4;
      }

      .custom-ip {
        background: rgba(255, 255, 255, 0.6);
        border-radius: 16px;
        padding: 16px;
        border: 1px solid rgba(0, 150, 199, 0.25);
      }

      .custom-ip label {
        display: block;
        font-size: 0.8rem;
        font-weight: 600;
        color: var(--deep-twilight);
        margin-bottom: 10px;
      }

      .ip-input-row {
        display: flex;
        align-items: center;
        gap: 6px;
        background: #fff;
        border-radius: 10px;
        padding: 8px 10px;
        box-shadow: inset 0 1px 3px rgba(3, 4, 94, 0.15);
        border: 1px solid var(--frosted-1);
      }

      .ip-input-row span {
        color: var(--french-blue);
        font-weight: 600;
        font-size: 0.92rem;
        white-space: nowrap;
      }

      .ip-input-row input {
        flex: 1;
        border: none;
        outline: none;
        font-size: 0.95rem;
        color: var(--deep-twilight);
        background: transparent;
        min-width: 0;
        text-align: center;
        font-variant-numeric: tabular-nums;
      }

      .go-btn {
        margin-top: 12px;
        width: 100%;
        padding: 12px;
        border: none;
        border-radius: 10px;
        background: linear-gradient(
          135deg,
          var(--turquoise),
          var(--blue-green)
        );
        color: var(--deep-twilight);
        font-weight: 700;
        font-size: 0.92rem;
        cursor: pointer;
        box-shadow: 0 6px 14px -4px rgba(0, 180, 216, 0.5);
        transition:
          transform 0.15s ease,
          filter 0.15s ease;
      }
      .go-btn:hover {
        filter: brightness(1.06);
        transform: translateY(-1px);
      }
      .go-btn:active {
        transform: translateY(0);
      }

      footer {
        text-align: center;
        margin-top: 24px;
        font-size: 0.72rem;
        color: var(--french-blue);
        opacity: 0.6;
        letter-spacing: 0.02em;
      }

      @media (max-width: 480px) {
        .card {
          padding: 34px 24px 28px;
          border-radius: 22px;
        }
        h1 {
          font-size: 1.3rem;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .card {
          animation: none;
        }
        .link-btn,
        .go-btn {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="icon-wrap">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <rect x="5" y="2" width="14" height="20" rx="3" />
          <line x1="5" y1="18" x2="19" y2="18" />
          <path d="M9 9l3-3 3 3M12 6v9" />
        </svg>
      </div>

      <h1>Transferencia entre dispositivos</h1>
      <p class="subtitle">
        Accede directamente a PlainApp sin escribir la IP cada vez
      </p>

      <div class="links" id="quickLinks">
        <a
          class="link-btn"
          href="http://192.168.1.4:8080"
          target="_blank"
          rel="noopener"
        >
          <span class="dot"></span>
          <span class="ip-text">192.168.1.4:8080</span>
          <span class="arrow">→</span>
        </a>
        <a
          class="link-btn"
          href="http://192.168.1.5:8080"
          target="_blank"
          rel="noopener"
        >
          <span class="dot"></span>
          <span class="ip-text">192.168.1.5:8080</span>
          <span class="arrow">→</span>
        </a>
        <a
          class="link-btn"
          href="http://192.168.1.6:8080"
          target="_blank"
          rel="noopener"
        >
          <span class="dot"></span>
          <span class="ip-text">192.168.1.6:8080</span>
          <span class="arrow">→</span>
        </a>
      </div>

      <div class="divider">¿Otra IP?</div>

      <div class="custom-ip">
        <label for="lastOctet"
          >Prueba con otro número si el router asignó una IP distinta</label
        >
        <div class="ip-input-row">
          <span>192.168.1.</span>
          <input
            type="number"
            id="lastOctet"
            min="1"
            max="254"
            placeholder="7"
            inputmode="numeric"
          />
          <span>:8080</span>
        </div>
        <button class="go-btn" onclick="goCustom()">Ir a esta dirección</button>
      </div>

      <footer>PlainApp · Acceso rápido en red local</footer>
    </div>

    <script>
      function goCustom() {
        const val = document.getElementById("lastOctet").value.trim();
        if (!val || isNaN(val) || val < 1 || val > 254) {
          document.getElementById("lastOctet").focus();
          return;
        }
        window.open(`http://192.168.1.${val}:8080`, "_blank", "noopener");
      }

      document
        .getElementById("lastOctet")
        .addEventListener("keydown", function (e) {
          if (e.key === "Enter") goCustom();
        });
    </script>
  </body>
</html>
